<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Kothrud Healthcare Access — WebGIS</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<style>
  html, body, #map { height: 100%; margin: 0; }
  #panel {
    position: absolute; top: 10px; left: 10px; z-index: 1;
    background: #fff; padding: 10px 14px; border-radius: 6px;
    font: 13px sans-serif; box-shadow: 0 1px 4px rgba(0,0,0,.3); max-width: 240px;
  }
  #panel h3 { margin: 0 0 6px; font-size: 14px; }
  #panel label { display: block; margin: 4px 0; }
  #legend { margin-top: 8px; font-size: 12px; }
  .legend-swatch { display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: middle; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <h3>Kothrud Healthcare Access</h3>
  <label><input type="checkbox" id="toggle-hex" checked> Coverage hexagons (H3 res 9)</label>
  <label><input type="checkbox" id="toggle-services" checked> Healthcare services</label>
  <label><input type="checkbox" id="toggle-buildings-wfs"> Buildings (one WFS GeoJSON request — perf test)</label>
  <div id="legend">
    <strong>Network distance to nearest service</strong><br>
    <span class="legend-swatch" style="background:#2ca25f"></span>&lt; 600m<br>
    <span class="legend-swatch" style="background:#fdae61"></span>600–1200m<br>
    <span class="legend-swatch" style="background:#d73027"></span>&gt; 1200m (beyond 15-min threshold)
  </div>
  <hr style="margin:10px 0;border:none;border-top:1px solid #ddd;">
  <strong>Bonus: live walking-isochrone API</strong>
  <p style="font-size:11px;color:#555;margin:4px 0;">Click anywhere on the map.</p>
  <label>Minutes: <span id="minutes-value">15</span>
    <input type="range" id="minutes-slider" min="1" max="30" value="15" style="width:100%;">
  </label>
  <div id="isochrone-status" style="font-size:11px;color:#555;"></div>
  <ol id="nearest-list" style="font-size:12px;padding-left:18px;margin:6px 0 0;"></ol>
</div>

<script>
const TILESERV = "http://localhost:7800";
const FEATURESERV = "http://localhost:9000";
const GEOSERVER = "http://localhost:8081/geoserver/webgis";
const ROUTING_API = "http://localhost:8020";

const map = new maplibregl.Map({
  container: "map",
  style: {
    version: 8,
    sources: {
      osm: {
        type: "raster",
        tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
        tileSize: 256,
        attribution: "&copy; OpenStreetMap contributors",
      },
    },
    layers: [{ id: "osm", type: "raster", source: "osm" }],
  },
  center: [73.8057, 18.5073],
  zoom: 14,
});

map.on("load", () => {
  // Hex coverage layer, served as vector tiles straight from pg_tileserv (MVT)
  map.addSource("hex", {
    type: "vector",
    tiles: [`${TILESERV}/public.hex_coverage_res9/{z}/{x}/{y}.pbf`],
  });
  map.addLayer({
    id: "hex-fill",
    type: "fill",
    source: "hex",
    "source-layer": "public.hex_coverage_res9",
    paint: {
      "fill-color": [
        "step", ["get", "network_dist_m"],
        "#2ca25f", 600, "#fdae61", 1200, "#d73027",
      ],
      "fill-opacity": 0.5,
    },
  });

  // Healthcare services, via OGC API - Features (pg_featureserv)
  fetch(`${FEATURESERV}/collections/public.services/items.json?limit=1000`)
    .then((r) => r.json())
    .then((geojson) => {
      map.addSource("services", { type: "geojson", data: geojson });
      map.addLayer({
        id: "services-points",
        type: "circle",
        source: "services",
        paint: { "circle-radius": 5, "circle-color": "#08519c", "circle-stroke-color": "#fff", "circle-stroke-width": 1 },
      });
      map.on("click", "services-points", (e) => {
        const p = e.features[0].properties;
        new maplibregl.Popup()
          .setLngLat(e.lngLat)
          .setHTML(`<b>${p.name || "(unnamed)"}</b><br>${p.amenity || p.healthcare || ""}`)
          .addTo(map);
      });
    });

  document.getElementById("toggle-hex").addEventListener("change", (e) => {
    map.setLayoutProperty("hex-fill", "visibility", e.target.checked ? "visible" : "none");
  });
  document.getElementById("toggle-services").addEventListener("change", (e) => {
    const v = e.target.checked ? "visible" : "none";
    if (map.getLayer("services-points")) map.setLayoutProperty("services-points", "visibility", v);
  });

  // Q9 perf test: load ALL buildings as one WFS GeoJSON request
  document.getElementById("toggle-buildings-wfs").addEventListener("change", (e) => {
    if (!e.target.checked) {
      if (map.getLayer("buildings-wfs-layer")) {
        map.removeLayer("buildings-wfs-layer");
        map.removeSource("buildings-wfs");
      }
      return;
    }
    const url = `${GEOSERVER}/ows?service=WFS&version=2.0.0&request=GetFeature&typeNames=webgis:buildings&outputFormat=application/json`;
    fetch(url)
      .then((r) => r.json())
      .then((geojson) => {
        map.addSource("buildings-wfs", { type: "geojson", data: geojson });
        map.addLayer({
          id: "buildings-wfs-layer",
          type: "fill",
          source: "buildings-wfs",
          paint: { "fill-color": "#888", "fill-opacity": 0.4, "fill-outline-color": "#444" },
        });
      });
  });

  // Bonus: click-to-isochrone + nearest-services, via the live FastAPI/pgRouting backend.
  const minutesSlider = document.getElementById("minutes-slider");
  const minutesValue = document.getElementById("minutes-value");
  const isoStatus = document.getElementById("isochrone-status");
  const nearestList = document.getElementById("nearest-list");
  let lastClick = null;

  minutesSlider.addEventListener("input", () => {
    minutesValue.textContent = minutesSlider.value;
    if (lastClick) runIsochrone(lastClick);
  });

  map.on("click", (e) => {
    // ignore clicks that landed on a service point (that has its own popup handler above)
    const hits = map.queryRenderedFeatures(e.point, { layers: ["services-points"] });
    if (hits.length) return;
    lastClick = e.lngLat;
    runIsochrone(lastClick);
    runNearest(lastClick);
  });

  function runIsochrone(lngLat) {
    const minutes = minutesSlider.value;
    isoStatus.textContent = "Loading isochrone...";
    const t0 = performance.now();
    fetch(`${ROUTING_API}/isochrone?lon=${lngLat.lng}&lat=${lngLat.lat}&minutes=${minutes}`)
      .then((r) => r.json())
      .then((feature) => {
        const clientMs = Math.round(performance.now() - t0);
        if (map.getLayer("isochrone-layer")) map.removeLayer("isochrone-layer");
        if (map.getSource("isochrone")) map.removeSource("isochrone");
        map.addSource("isochrone", { type: "geojson", data: feature });
        map.addLayer({
          id: "isochrone-layer",
          type: "fill",
          source: "isochrone",
          paint: { "fill-color": "#3182bd", "fill-opacity": 0.25, "fill-outline-color": "#08519c" },
        }, "services-points");
        isoStatus.textContent = `${feature.properties.reached_nodes} nodes reached, ` +
          `${(feature.properties.area_m2 / 1e6).toFixed(2)} km² ` +
          `(${clientMs}ms round-trip, ${feature._timing.db_ms}ms db)`;
      });
  }

  function runNearest(lngLat) {
    fetch(`${ROUTING_API}/nearest?lon=${lngLat.lng}&lat=${lngLat.lat}&k=5`)
      .then((r) => r.json())
      .then((data) => {
        nearestList.innerHTML = data.results
          .map((s) => `<li>${s.name} — ${s.minutes} min (${s.distance_m}m)</li>`)
          .join("");
      });
  }
});
</script>
</body>
</html>
